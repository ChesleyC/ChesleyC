<svg xmlns="http://www.w3.org/2000/svg" width="900" height="390" viewBox="0 0 900 390" role="img" aria-labelledby="title desc">
  <title id="title">Take a little coffee break</title>
  <desc id="desc">A 32-second espresso ritual: grind the beans, pour the grounds into the portafilter, slide a cup underneath, brew the coffee, and brush the spilled grounds off the counter. Then enjoy a quiet moment.</desc>
  <style>
    :root { --paper:#faf7f0; --ink:#50483d; --muted:#8d8578; --line:#e4ddd0; --wall:#f1ebdf; --counter:#e2d3bd; --metal:#e7e4dd; --metal-dark:#c8c5bc; --outline:#817d71; --cup:#fffaf0; --steam:#9b8b71; --cycle:32s; }
    @media (prefers-color-scheme:dark) { :root { --paper:#232724; --ink:#e8e0d1; --muted:#b4ad9c; --line:#3f4840; --wall:#303631; --counter:#675a47; --metal:#a7aca3; --metal-dark:#858e85; --outline:#5d695f; --cup:#eee6d5; --steam:#d7c7aa; } }
    text { font-family:Georgia,'Times New Roman',serif; }
    .label { font-family:Arial,sans-serif; font-size:11px; letter-spacing:3px; fill:var(--muted); }
    .beans { animation:grind var(--cycle) linear infinite; transform-origin:227px 147px; }
    .burr { animation:burr var(--cycle) linear infinite; transform-origin:229px 205px; }
    .grounds-stream { opacity:0; animation:grounds var(--cycle) linear infinite; }
    .grains { animation:grainfall .45s linear infinite; }
    .dosing-cup { transform-origin:298px 240px; animation:dose var(--cycle) ease-in-out infinite; }
    .dose-fill { animation:dosefill var(--cycle) linear infinite; }
    .pour-stream { opacity:0; animation:pour var(--cycle) linear infinite; }
    .portafilter { transform-origin:649px 216px; animation:lock var(--cycle) ease-in-out infinite; }
    .mug { animation:placecup var(--cycle) ease-in-out infinite; }
    .coffee-fill { animation:fill var(--cycle) ease-in-out infinite; }
    .brew-stream { opacity:0; animation:brew var(--cycle) linear infinite; }
    .drip { animation:drip .85s linear infinite; }
    .steam { opacity:0; animation:steamshow var(--cycle) linear infinite; }
    .wisp { animation:waft 4s ease-in-out infinite; }
    .wisp.second { animation-delay:-2s; }
    .spill-a { opacity:0; animation:spilla var(--cycle) linear infinite; }
    .spill-b { opacity:0; animation:spillb var(--cycle) linear infinite; }
    .spill-c { opacity:0; animation:spillc var(--cycle) linear infinite; }
    .brush { opacity:0; animation:sweep var(--cycle) ease-in-out infinite; }
    .caption { font-size:15px; font-style:italic; fill:var(--ink); text-anchor:middle; opacity:0; }
    .step-1 { animation:caption1 var(--cycle) linear infinite; }
    .step-2 { animation:caption2 var(--cycle) linear infinite; }
    .step-3 { animation:caption3 var(--cycle) linear infinite; }
    .step-4 { animation:caption4 var(--cycle) linear infinite; }
    .step-5 { animation:caption5 var(--cycle) linear infinite; }
    @keyframes grind { 0%,2% { transform:translate(0,0); } 3%,5%,7%,9%,11%,13% { transform:translate(.8px,-.6px); } 4%,6%,8%,10%,12%,14% { transform:translate(-.8px,.6px); } 15%,100% { transform:translate(0,0); } }
    @keyframes burr { 0% { transform:rotate(0); } 15% { transform:rotate(1080deg); } 100% { transform:rotate(1080deg); } }
    @keyframes grounds { 0%,2% { opacity:0; } 3%,14% { opacity:1; } 15%,100% { opacity:0; } }
    @keyframes grainfall { from { transform:translateY(-5px); } to { transform:translateY(5px); } }
    @keyframes dose { 0%,16% { transform:translate(0,0) rotate(0); } 20% { transform:translate(323px,-43px) rotate(0); } 23%,27% { transform:translate(323px,-43px) rotate(72deg); } 30% { transform:translate(323px,-43px) rotate(0); } 34%,100% { transform:translate(0,0) rotate(0); } }
    @keyframes dosefill { 0%,2% { opacity:0; } 8%,23% { opacity:1; } 27%,100% { opacity:0; } }
    @keyframes pour { 0%,23% { opacity:0; } 24%,26% { opacity:1; } 27%,100% { opacity:0; } }
    @keyframes lock { 0%,30% { transform:rotate(-12deg); } 33%,100% { transform:rotate(0); } }
    @keyframes placecup { 0%,34% { transform:translateX(96px); } 40%,98% { transform:translateX(0); } 100% { transform:translateX(96px); } }
    @keyframes brew { 0%,41% { opacity:0; } 43%,61% { opacity:1; } 63%,100% { opacity:0; } }
    @keyframes drip { 0% { transform:translateY(-4px); opacity:0; } 25% { opacity:1; } 100% { transform:translateY(16px); opacity:0; } }
    @keyframes fill { 0%,42% { transform:translateY(25px); } 63%,97% { transform:translateY(0); } 100% { transform:translateY(25px); } }
    @keyframes steamshow { 0%,58% { opacity:0; } 64%,96% { opacity:.65; } 100% { opacity:0; } }
    @keyframes waft { 0%,100% { transform:translate(0,0); } 50% { transform:translate(3px,-5px); } }
    @keyframes spilla { 0%,24% { opacity:0; } 27%,68% { opacity:1; } 71%,100% { opacity:0; } }
    @keyframes spillb { 0%,24% { opacity:0; } 27%,72% { opacity:1; } 75%,100% { opacity:0; } }
    @keyframes spillc { 0%,24% { opacity:0; } 27%,76% { opacity:1; } 79%,100% { opacity:0; } }
    @keyframes sweep { 0%,65% { opacity:0; transform:translate(0,-25px) rotate(-5deg); } 67% { opacity:1; transform:translate(0,0) rotate(-5deg); } 79% { opacity:1; transform:translate(108px,0) rotate(3deg); } 81% { opacity:1; transform:translate(108px,-12px) rotate(3deg); } 84% { opacity:1; transform:translate(0,-12px) rotate(-5deg); } 86% { opacity:1; transform:translate(0,0) rotate(-5deg); } 91% { opacity:1; transform:translate(108px,0) rotate(3deg); } 94%,100% { opacity:0; transform:translate(108px,-25px) rotate(3deg); } }
    @keyframes caption1 { 0%,14% { opacity:1; } 16%,100% { opacity:0; } }
    @keyframes caption2 { 0%,16% { opacity:0; } 18%,32% { opacity:1; } 34%,100% { opacity:0; } }
    @keyframes caption3 { 0%,34% { opacity:0; } 36%,62% { opacity:1; } 64%,100% { opacity:0; } }
    @keyframes caption4 { 0%,64% { opacity:0; } 66%,90% { opacity:1; } 92%,100% { opacity:0; } }
    @keyframes caption5 { 0%,92% { opacity:0; } 94%,99% { opacity:1; } 100% { opacity:0; } }
    @media (prefers-reduced-motion:reduce) { * { animation:none !important; } .grounds-stream,.pour-stream,.brew-stream,.brush,.spill-a,.spill-b,.spill-c,.step-1,.step-2,.step-3,.step-4 { opacity:0; } .step-5 { opacity:1; } .steam { opacity:.5; } .dose-fill { opacity:0; } }
  </style>
  <defs>
    <clipPath id="scene"><rect x="35" y="76" width="830" height="251" rx="18"/></clipPath>
    <clipPath id="mug-interior"><path d="M628 259 H674 L669 285 H633Z"/></clipPath>
    <g id="bean"><ellipse rx="5" ry="3.5" fill="#725039"/><path d="M-3 1 Q0-2 3-1" fill="none" stroke="#b28c60" stroke-width="1"/></g>
  </defs>
  <rect x="1" y="1" width="898" height="388" rx="22" fill="var(--paper)" stroke="var(--line)"/>
  <text x="40" y="37" class="label">TAKE A LITTLE BREAK</text>
  <text x="850" y="37" text-anchor="end" class="label">SLOW COFFEE / 32s</text>
  <g clip-path="url(#scene)">
    <rect x="35" y="76" width="830" height="251" fill="var(--wall)"/>
    <path d="M93 114 V277 M807 114 V277" stroke="var(--line)" stroke-width="1"/>
    <rect x="115" y="103" width="91" height="57" rx="4" fill="var(--paper)" stroke="var(--line)"/>
    <path d="M136 137 Q147 117 161 136 Q173 150 185 127" fill="none" stroke="#8c1515" stroke-width="2" opacity=".65"/>
    <path d="M129 146 H191" stroke="var(--line)"/>
    <path d="M35 291 H865 V327 H35Z" fill="var(--counter)"/>
    <path d="M35 291 H865" stroke="#b39a7b" stroke-width="2"/>
    <ellipse cx="244" cy="289" rx="75" ry="5" fill="var(--ink)" opacity=".08"/>
    <ellipse cx="645" cy="289" rx="98" ry="5" fill="var(--ink)" opacity=".08"/>
    <!-- Grinder and a transparent bean hopper. -->
    <path d="M202 127 H251 L246 170 H209Z" fill="var(--paper)" fill-opacity=".7" stroke="var(--outline)" stroke-width="2"/>
    <g class="beans">
      <use href="#bean" x="214" y="145" transform="rotate(21 214 145)"/><use href="#bean" x="229" y="143" transform="rotate(-28 229 143)"/>
      <use href="#bean" x="240" y="147"/><use href="#bean" x="218" y="156"/><use href="#bean" x="232" y="157" transform="rotate(35 232 157)"/>
    </g>
    <rect x="198" y="121" width="57" height="7" rx="3" fill="var(--outline)"/>
    <rect x="216" y="166" width="24" height="13" rx="2" fill="var(--outline)"/>
    <path d="M197 177 Q196 171 203 171 H252 Q259 172 259 180 V269 H197Z" fill="#8c1515"/>
    <path d="M203 180 V258" stroke="#b85c58" stroke-width="3" stroke-linecap="round" opacity=".5"/>
    <circle cx="229" cy="205" r="15" fill="#f0e3cd"/>
    <g class="burr" stroke="#8c1515" stroke-width="2" stroke-linecap="round"><path d="M220 205 H238 M229 196 V214"/></g>
    <path d="M258 207 H291 V219 H281 V215 H258Z" fill="var(--metal-dark)" stroke="var(--outline)" stroke-width="1"/>
    <rect x="189" y="269" width="79" height="13" rx="4" fill="var(--outline)"/>
    <path d="M205 282 V289 M252 282 V289" stroke="var(--outline)" stroke-width="4"/>
    <g class="grounds-stream" fill="#765239"><g class="grains"><circle cx="285" cy="220" r="1.5"/><circle cx="289" cy="225" r="1"/><circle cx="283" cy="231" r="1.3"/><circle cx="291" cy="236" r="1.2"/><circle cx="287" cy="242" r="1.4"/></g></g>
    <!-- Espresso machine; the portafilter locks before the cup arrives. -->
    <path d="M565 136 Q565 126 576 126 H720 Q731 126 731 136 V281 H565Z" fill="var(--metal)" stroke="var(--outline)" stroke-width="2"/>
    <path d="M570 136 H726 V177 H570Z" fill="#8c1515"/>
    <path d="M577 136 H718" stroke="#b85c58" stroke-width="2" opacity=".6"/>
    <circle cx="649" cy="154" r="13" fill="#f5ecdc"/>
    <path d="M641 157 A9 9 0 0 1 657 157 M649 155 L653 149" fill="none" stroke="#6d6356" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="590" cy="153" r="4" fill="#e5caa0"/><circle cx="706" cy="153" r="4" fill="#e5caa0"/>
    <rect x="584" y="185" width="129" height="93" rx="5" fill="var(--outline)" fill-opacity=".2"/>
    <path d="M635 177 H663 V204 H635Z" fill="var(--metal-dark)"/>
    <g class="portafilter">
      <path d="M631 207 H668 L663 221 H638Z" fill="var(--metal-dark)" stroke="var(--outline)" stroke-width="1.5"/>
      <path d="M638 213 H598" stroke="#393d35" stroke-width="7" stroke-linecap="round"/>
      <path d="M644 221 V228 M655 221 V228" stroke="var(--outline)" stroke-width="3"/>
    </g>
    <path d="M712 189 V224 Q712 233 721 233" fill="none" stroke="var(--metal-dark)" stroke-width="4" stroke-linecap="round"/>
    <rect x="570" y="278" width="155" height="8" rx="3" fill="var(--metal-dark)"/>
    <path d="M589 281 H706" stroke="var(--outline)" stroke-width="1" stroke-dasharray="2 4"/>
    <path d="M579 285 V289 M715 285 V289" stroke="var(--outline)" stroke-width="4"/>
    <!-- A dosing cup moves from the grinder to the portafilter and tips. -->
    <g class="dosing-cup">
      <path d="M277 242 H314 L310 266 Q298 272 282 266Z" fill="var(--metal)" stroke="var(--outline)" stroke-width="1.5"/>
      <ellipse cx="295.5" cy="242" rx="18.5" ry="4" fill="var(--metal-dark)" stroke="var(--outline)" stroke-width="1"/>
      <ellipse class="dose-fill" cx="295.5" cy="242" rx="15" ry="2.5" fill="#765239"/>
      <path d="M281 248 L283 261" stroke="var(--paper)" stroke-width="2" opacity=".6"/>
    </g>
    <g class="pour-stream" fill="#765239"><g class="grains"><circle cx="639" cy="202" r="1.3"/><circle cx="644" cy="205" r="1.5"/><circle cx="648" cy="209" r="1.2"/><circle cx="653" cy="211" r="1.4"/></g></g>
    <!-- Cup slides onto the tray, then fills from the bottom. -->
    <g class="mug">
      <ellipse cx="651" cy="286" rx="34" ry="3" fill="var(--cup)"/>
      <path d="M674 261 Q692 259 690 270 Q689 279 672 278" fill="none" stroke="var(--cup)" stroke-width="5"/>
      <path d="M625 255 H677 L671 280 Q651 290 631 280Z" fill="var(--cup)" stroke="#b6a88f" stroke-width="1.5"/>
      <g clip-path="url(#mug-interior)"><g class="coffee-fill"><rect x="626" y="262" width="50" height="26" fill="#8d5b37"/><ellipse cx="651" cy="262" rx="25" ry="3" fill="#c9965d"/></g></g>
      <ellipse cx="651" cy="256" rx="25" ry="4" fill="none" stroke="#b6a88f" stroke-width="1.5"/>
      <path d="M639 271 Q646 267 649 273 Q652 267 659 271 Q656 277 649 281 Q642 277 639 271Z" fill="#8c1515" opacity=".75"/>
      <g class="steam" fill="none" stroke="var(--steam)" stroke-width="1.5" stroke-linecap="round">
        <path class="wisp" d="M641 248 Q633 240 641 232 Q649 224 642 217"/>
        <path class="wisp second" d="M658 247 Q665 238 657 230 Q650 222 657 213"/>
      </g>
    </g>
    <g class="brew-stream" fill="none" stroke="#825532" stroke-width="2" stroke-linecap="round"><path d="M644 228 Q646 239 646 255 M655 228 Q653 239 653 255"/><circle class="drip" cx="649" cy="245" r="1" fill="#825532" stroke="none"/></g>
    <!-- Spilled grounds disappear in order as the little brush crosses them. -->
    <g fill="#715039">
      <g class="spill-a"><circle cx="366" cy="287" r="1.6"/><circle cx="372" cy="289" r="1"/><circle cx="380" cy="285" r="1.4"/><circle cx="388" cy="289" r="1.2"/><circle cx="393" cy="287" r="1.5"/><circle cx="378" cy="292" r="1"/></g>
      <g class="spill-b"><circle cx="400" cy="289" r="1.2"/><circle cx="407" cy="286" r="1.6"/><circle cx="415" cy="290" r="1.4"/><circle cx="421" cy="287" r="1"/><circle cx="411" cy="293" r="1.1"/></g>
      <g class="spill-c"><circle cx="430" cy="288" r="1.5"/><circle cx="436" cy="291" r="1"/><circle cx="443" cy="286" r="1.3"/><circle cx="450" cy="289" r="1.2"/><circle cx="442" cy="293" r="1"/></g>
    </g>
    <g transform="translate(348 279)"><g class="brush">
      <path d="M0 0 L9-7 L38-38 Q45-44 49-39 Q53-35 48-30 L17 0Z" fill="#a88358" stroke="#846543" stroke-width="1"/>
      <circle cx="46" cy="-36" r="1.5" fill="#614e39"/>
      <path d="M0 0 H18 L23 10 H-5Z" fill="#d3b889"/>
      <path d="M0 1 L-2 9 M4 1 L3 10 M8 1 V10 M12 1 L13 10 M16 1 L19 9" stroke="#947753" stroke-width="1"/>
    </g></g>
    <!-- A cardinal-red bag of beans and a small plant make the counter feel lived-in. -->
    <path d="M413 222 H452 L459 275 H408Z" fill="#8c1515"/>
    <path d="M413 222 H452 V230 H413Z" fill="#a6534a"/>
    <rect x="418" y="240" width="28" height="22" rx="2" fill="#f0e3cd"/>
    <use href="#bean" x="432" y="251" transform="rotate(-25 432 251)"/>
    <g transform="translate(32 0)">
      <path d="M773 274 V235 M773 254 Q752 244 758 234 Q774 233 773 254 M775 244 Q793 238 790 226 Q775 229 775 244" fill="#748268" stroke="#5d6b53" stroke-width="1.5"/>
      <path d="M757 270 H791 L786 289 H762Z" fill="#bfa283"/>
    </g>
  </g>
  <text x="450" y="359" class="caption step-1">First, a few freshly ground beans.</text>
  <text x="450" y="359" class="caption step-2">A little dose. A little care.</text>
  <text x="450" y="359" class="caption step-3">Cup underneath. Let it take its time.</text>
  <text x="450" y="359" class="caption step-4">A tiny brush. Everything back in its place.</text>
  <text x="450" y="359" class="caption step-5">Nothing to rush. Enjoy your coffee.</text>
</svg>
